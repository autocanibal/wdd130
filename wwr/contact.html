<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Monde Mkhize">
    <meta name="description"
      content="This is the page with contact details and other information to get ahold of the company.">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us</title>
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Logo of with text: Rapids">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Rapids</h2>
            <p><br>123 Main River Street</br>Kolob, California</br>+1 999 999
                9999</br>info@whitewater.com</p>
        </section>
        <aside>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d37336.887569076214!2d31.524604842096476!3d-26.674917939327855!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1eef60993220ef17%3A0x7d089bb97e2bc845!2sUsutu%20River%20Rafting%20Out!5e0!3m2!1sen!2s!4v1786254036258!5m2!1sen!2s"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </aside>
        <section>
            <img src="https://picsum.photos/200/300?random=1">
            <img src="https://picsum.photos/200/300?random=2">
            <img src="https://picsum.photos/200/300?random=3">
        </section>
        <section>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                </br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                </br>

                <label for="purpose">Message Purpose:</label>
                <input type="radio" id="general_inquiry" name="message_type"
                  value="general_inquiry">
                <label for="general_inquiry">General Inquiry</label><br>
                <input type="radio" id="reservation_question" name="message_type"
                  value="reservation_question">
                <label for="reservation_question">Reservation Question</label><br>
                <input type="radio" id="website_suggestion" name="message_type"
                  value="website_suggestion">
                <label for="website_suggestion">Website Suggestion</label>
                </br>
                <label for="message">Message</label>
                <textarea name="message"></textarea>
                </br>
                <input type="checkbox" id="newsletter_subscription" name="newsletter_subscription"
                  value="True">
                <label for="newsletter_subscription">Please subscribe me to the monthly
                    newsletter</label>
                <input type="submit" value="Get In Touch!">
            </form>
        </section>
    </main>
    <footer>
        <p>©2026 | Rapids | Monde Mkhize</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
